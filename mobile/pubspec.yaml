name: tramites_ia
description: "Asistente de trámites peruanos (TramitesIA)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0-327.4.beta

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0          # llamadas al backend (POST /preguntar)
  url_launcher: ^6.3.3  # abrir las fuentes oficiales en el navegador
  shared_preferences: ^2.5.5  # recordar el tema elegido al cerrar la app

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4  # genera los íconos de Android (solo en desarrollo)

flutter:
  uses-material-design: true

  # Atkinson Hyperlegible va incluida en la app (no se descarga al usarla),
  # así se ve bien desde el primer uso aunque la conexión sea mala.
  # Licencia SIL Open Font License: assets/fonts/OFL.txt
  fonts:
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Italic.ttf
          style: italic
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegible-BoldItalic.ttf
          weight: 700
          style: italic

# Ícono de la app (opción C, "Burbuja"). Fuentes SVG en assets/icon/.
# Para regenerarlo: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false  # por ahora solo se publica en Android
  image_path: "assets/icon/icono.png"  # ícono clásico (Android 7.1 o anterior)
  # Ícono adaptativo (Android 8+): fondo y primer plano en capas separadas.
  adaptive_icon_background: "#7A1F2B"  # granate de DESIGN.md
  adaptive_icon_foreground: "assets/icon/icono_primer_plano.png"
  # 0: el diseño ya ocupa el lienzo de 108 dp respetando la zona segura de 66 dp.
  # Con el valor por defecto (16 %) el símbolo saldría reducido.
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/icon/icono_monocromo.png"  # íconos temáticos, Android 13+
